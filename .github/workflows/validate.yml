name: Validate Catalog

on:
  push:
    paths:
      - 'Catalog/**/*.ini'
  pull_request:
    paths:
      - 'Catalog/**/*.ini'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate catalog
        run: python Tools/validate-ini/validate.py
